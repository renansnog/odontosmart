{% extends "base.html" %}
{% block titulo %}Acesso administrativo{% endblock %}
{% block estilos %}
<link rel="stylesheet" href="{{ url_for('css_admin', arquivo='login.css') }}">
{% endblock %}
{% block conteudo %}
<section class="login-container">
  <h1>Área administrativa</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Usuário</label>
    <input id="username" name="username" autocomplete="username" maxlength="50" required autofocus>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
